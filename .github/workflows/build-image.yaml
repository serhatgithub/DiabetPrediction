name: Build and push training image

on:
  push:
    branches:
      - main
      - master
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "src/**"
      - "diabetes.csv"
      - "requirements.txt"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/serhatgithub/diabetprediction-training:latest
            ghcr.io/serhatgithub/diabetprediction-training:${{ github.sha }}
