name: Build and push training image

on:
  push:
    branches:
      - main
      - master
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "src/**"
      - "diabetes.csv"
      - "requirements.txt"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            serhatsdocker/diabetprediction-training:latest
            serhatsdocker/serhatgithub/diabetprediction-training:${{ github.sha }}
